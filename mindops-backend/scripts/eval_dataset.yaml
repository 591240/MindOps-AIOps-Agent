# 诊断质量评测集（P0-1）
#
# 为什么需要它：`scripts/e2e_api_smoke.py` 的 51 条只证明"接口通不通"，
# 不证明"诊断准不准"。有了本评测集，`CONF_THRESHOLD=0.6` 是否合理、
# 规则命中的 0.95 该不该调、置信度回环到底有没有用 —— 才有数据可回答。
#
# 判定口径：`root_cause` 归一化后包含 `expect_keywords` 中**任意一个**即算命中。
# 关键词取"正确结论一定会提到"的业务词，不追求与模型用词逐字一致。
#
# 难度分档（对齐 OpenRCA 的 easy / middle / hard）：
# - easy   ：现象文本含规则库关键词，规则层可直接短路口径命中
# - middle ：不含规则关键词，需要模型结合现象推断
# - hard   ：根因不在告警组件自身，需要跨组件/多源证据串联
#
# 红鲱鱼样本（`red_herring: true`，借鉴 OpenSRE 合成评测的 adversarial red herrings，
# https://github.com/Tracer-Cloud/opensre）：
# 告警面（title 与 detail 前半）强烈暗示一个错误组件 —— 规则层极易误命中、模型极易
# 顺着告警面复述 —— 而 detail 后半藏着指向真实根因的**相反**证据。专门考察
# "模型是否沿证据链上溯"，对治 OpenRCA 失败模式研究中的 Symptom-as-Cause（39.9%）
# 与 Incomplete Exploration（63.9%）：合格的诊断必须**先排除告警面假设**再下结论。
# 判定口径与普通样本一致：`expect_keywords` 只含真实根因一定会提到的词，
# 顺着告警面作答（"上游不可用 / 连接池太小 / SQL 没走索引"）必然 miss。
version: 1
updated: 2026-09-13

