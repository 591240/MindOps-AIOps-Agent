# F-03 MVP 风险库。命中任一 high 规则时必须人工确认，系统不执行命令。
high:
  - '(?i)\brm\s+-[^\n]*r'
  - '(?i)\bdrop\s+(database|table|schema)\b'
  - '(?i)\btruncate\s+table\b'
  - '(?i)\bdelete\s+from\b'
  - '(?i)\bshutdown\b'
  - '(?i)\breboot\b'
  - '(?i)\bpoweroff\b'
  - '(?i)\bmkfs\b'
  - '(?i)\bdd\s+if='
  - '(?i)\bkill\s+-9\s+1\b'
  - '(?i)\bkillall\b'
  - '(?i)\bpkill\s+-9'
  - '(?i)\bkubectl\s+delete\b'
  - '(?i)\bhelm\s+uninstall\b'
  - '(?i)\bdocker\s+(rm|system prune)\b'
  - '(?i)\bredis-cli\s+flush(all|db)\b'
  - '(?i)\bflushall\b'
  - '(?i)\biptables\s+-F\b'
  - '(?i)\bchmod\s+-R\s+777\b'
  - '(?i)\bterraform\s+destroy\b'
  - '(?i)\baws\s+.*\bdelete-'
medium:
  - '(?i)\b(systemctl|service)\s+.*\brestart\b'
  - '(?i)\bkill\s+\d+'
  - '(?i)\bconfig\s+set\b'
  - '(?i)\bscale\b'
  - '(?i)\brollout\s+restart\b'
low:
  - '(?i)\b(get|show|describe|info|status|top|df|free|grep|tail)\b'
